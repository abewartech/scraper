name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  php:
    name: PHP 7.4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, json, tokenizer, xml, ctype
          coverage: none

      - name: Install Composer dependencies
        # --no-scripts: this project's Laravel 6.7 package manifest predates
        # Composer 2's installed.json format, so artisan package:discover is
        # run manually after translating the manifest (see next step).
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Adapt installed.json for Laravel 6 package discovery
        # Composer 2 writes vendor/composer/installed.json as {"packages": [...]};
        # Laravel 6.7's PackageManifest only understands the flat array Composer 1
        # wrote. Translate the format (data unchanged) so package:discover works.
        run: php -r '$f="vendor/composer/installed.json"; $d=json_decode(file_get_contents($f),true); if(isset($d["packages"])){file_put_contents($f,json_encode(array_values($d["packages"]))); echo "translated\n";}'

      - name: Discover packages
        run: php artisan package:discover --ansi

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run test suite
        run: vendor/bin/phpunit
