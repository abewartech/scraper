name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  php:
    name: PHP 7.4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, json, tokenizer, xml, ctype
          coverage: none

      - name: Install Composer 1 (matches this project's lockfile era)
        run: |
          curl -sS https://getcomposer.org/installer -o composer-setup.php
          sudo php composer-setup.php --version=1.10.26 --install-dir=/usr/local/bin --filename=composer1
          rm composer-setup.php
          composer1 --version

      - name: Install Composer dependencies
        run: composer1 install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run test suite
        run: vendor/bin/phpunit
